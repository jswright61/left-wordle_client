<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Release Notes — Left Wordle</title>
    <style>
        body {
            font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
            background-color: #fff;
            color: #1a1a1b;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        .page {
            width: 100%;
            max-width: 640px;
        }
        .back-link { display: inline-block; margin-bottom: 16px; color: #538d4e; font-size: 0.85rem; }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.1rem;
            text-transform: uppercase;
            border-bottom: 1px solid #d3d6da;
            padding-bottom: 16px;
            margin-bottom: 8px;
            text-align: center;
        }
        .subtitle {
            font-size: 0.85rem;
            color: #787c7e;
            margin-bottom: 32px;
            text-align: center;
        }
        section {
            padding: 20px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        section:first-of-type {
            padding-top: 0;
        }
        section:target h2 a {
            color: #538d4e;
        }
        h2 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.03rem;
            margin: 0;
        }
        h2 a {
            color: #1a1a1b;
            text-decoration: none;
        }
        h2 a:hover {
            text-decoration: underline;
        }
        ul {
            margin: 10px 0 0;
            padding-left: 1.2rem;
        }
        li {
            font-size: 0.9rem;
            line-height: 1.55;
            color: #3a3a3c;
            margin-bottom: 6px;
        }
        a { color: #538d4e; }
    </style>
</head>
<body>
<div class="page">
    <a href="/" class="back-link">&larr; Back to Left Wordle</a>
    <h1>Release Notes</h1>
    <p class="subtitle">What's new in each release, most recent first.</p>

    <!--
      Add a new <section> here, above the previous one, for each release.
      The id is the version tag with dots replaced by dashes, so v0.9.19
      becomes id="v0-9-19" and links as /release-notes#v0-9-19.

      <section id="v0-9-19">
          <h2><a href="#v0-9-19">v0.9.19</a></h2>
          <ul>
              <li>Some feature or fix.</li>
          </ul>
      </section>
    -->

</div>
</body>
</html>
